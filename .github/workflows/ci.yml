name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type gate: the shipping product (app + lib + middleware) must type
      # clean. Legacy src/ (dead Vite tree) is excluded by tsconfig.ci.json
      # and tracked as debt — it never ships to production.
      - name: Typecheck (shipping product)
        run: npm run typecheck:ci

      # Security regression tests: open-redirect, redaction, error grouping,
      # hashtag grammar, and static authorization-pattern checks. No DB.
      - name: Security regression tests
        run: npm run security-tests

      # Dependency audit gate: fails on any HIGH/CRITICAL advisory outside
      # scripts/security-audit-baseline.json (documented residuals only).
      - name: Dependency vulnerability audit
        run: npm run dependency-audit

      # Build gate: untested code cannot silently reach production.
      # Builds without env vars (Supabase URLs etc.) — the app tolerates
      # unconfigured clients at build time by design (isSupabaseConfigured).
      - name: Build
        run: npm run build

      # Destructive migration guard: destructive schema changes (DROP
      # TABLE / DROP COLUMN / RENAME) are forbidden by project policy.
      # Real migration validation happens in the restore test / staging.
      - name: Migration destructive-change guard
        run: |
          node -e "
            const fs = require('fs');
            const files = fs.readdirSync('supabase/migrations').filter(f => f.endsWith('.sql'));
            const bad = [];
            for (const f of files) {
              const src = fs.readFileSync('supabase/migrations/' + f, 'utf8');
              const lines = src.split(/\n/).map(l => l.replace(/--.*$/, '').trim()).filter(Boolean);
              for (const line of lines) {
                const s = line.toLowerCase();
                if (/^\s*(drop\s+(table|column|schema|view|index)\s)|(alter\s+table[^;]*\s+drop\s+column)/.test(s)) {
                  bad.push(f + ': ' + line);
                }
              }
            }
            if (bad.length) {
              console.error('Destructive migration statements found:');
              for (const b of bad) console.error(' - ' + b);
              process.exit(1);
            }
            console.log('Destructive migration guard passed (' + files.length + ' migrations).');
          "